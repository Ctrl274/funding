<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Funding Arbitrage - Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/" class="active">Dashboard</a>
        <a href="/settings">Settings</a>
        <a href="/positions">Positions</a>
        <a href="/history">History</a>
    </nav>

    <div class="container">
        <h1 class="page-title">Dashboard</h1>

        <div class="panel">
            <h2>System Status</h2>
            <div class="status-grid">
                <div class="status-item">
                    <span class="label">Monitor</span>
                    <span class="value" id="monitor-status"><span class="loading-skeleton">Loading</span></span>
                </div>
                <div class="status-item">
                    <span class="label">Next Settlement</span>
                    <span class="value" id="next-settlement"><span class="loading-skeleton">Loading</span></span>
                </div>
                <div class="status-item">
                    <span class="label">Current Positions</span>
                    <span class="value" id="position-count"><span class="loading-skeleton">Loading</span></span>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>Funding Rates (Live)</h2>
            <div class="table-scroll">
                <table id="rates-table">
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Binance</th>
                            <th>Bybit</th>
                            <th>BYDFi</th>
                            <th>MEXC</th>
                            <th>Max Diff</th>
                            <th>Next Settlement</th>
                        </tr>
                    </thead>
                    <tbody id="rates-body">
                        <tr><td colspan="7"><div class="empty-state"><div class="loading-skeleton">Loading rates...</div></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="/static/app.js"></script>
    <script>
        refreshStatus();
        refreshRates();
        setInterval(refreshRates, 5000);
    </script>
</body>
</html>
