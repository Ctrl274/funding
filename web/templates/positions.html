<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Positions</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/">Dashboard</a>
        <a href="/settings">Settings</a>
        <a href="/positions" class="active">Positions</a>
        <a href="/history">History</a>
    </nav>

    <div class="container">
        <h1 class="page-title">Positions</h1>

        <div class="panel">
            <h2>Current Positions</h2>
            <div class="table-scroll">
                <table id="positions-table">
                    <thead>
                        <tr>
                            <th>Symbol</th>
                            <th>Long Exchange</th>
                            <th>Short Exchange</th>
                            <th>Quantity</th>
                            <th>Open Time</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="positions-body">
                        <tr><td colspan="6"><div class="empty-state"><div class="loading-skeleton">Loading positions...</div></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="/static/app.js"></script>
    <script>
        refreshPositions();
        setInterval(refreshPositions, 5000);
    </script>
</body>
</html>
