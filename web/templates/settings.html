<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav>
        <a href="/">Dashboard</a>
        <a href="/settings" class="active">Settings</a>
        <a href="/positions">Positions</a>
        <a href="/history">History</a>
    </nav>

    <div class="container">
        <h1 class="page-title">Settings</h1>

        <div class="panel">
            <h2>Monitor Settings</h2>
            <form id="settings-form" novalidate>
                <div class="form-group">
                    <label for="monitor-enabled">Monitor Enabled</label>
                    <input type="checkbox" name="monitor.enabled" id="monitor-enabled">
                </div>
                <div class="form-group">
                    <label for="polling-interval">Polling Interval (seconds)</label>
                    <input type="number" name="monitor.polling_interval" id="polling-interval" value="60" min="5" max="3600" required>
                </div>
                <div class="form-group">
                    <label for="min-rate-diff">Min Rate Diff (%)</label>
                    <input type="number" step="0.001" name="strategy.min_rate_diff" id="min-rate-diff" value="0.01" min="0" max="1" required>
                </div>
                <div class="form-group">
                    <label for="max-concurrent">Max Concurrent</label>
                    <input type="number" name="strategy.max_concurrent" id="max-concurrent" value="3" min="1" max="20" required>
                </div>
                <div class="form-group">
                    <label for="position-value">Position Value (USDT per side)</label>
                    <input type="number" name="strategy.position_value" id="position-value" value="1000" min="10" required>
                </div>
                <div class="form-group">
                    <label for="position-mode">Position Mode</label>
                    <select name="strategy.position_mode" id="position-mode">
                        <option value="fixed">Fixed</option>
                        <option value="percent">Percent</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="position-percent">Position Percent (%)</label>
                    <input type="number" name="strategy.position_percent" id="position-percent" value="5" min="0.1" max="100" step="0.1" required>
                </div>
                <div class="form-group">
                    <label for="leverage">Leverage</label>
                    <input type="number" name="strategy.leverage" id="leverage" value="5" min="1" max="125" required>
                </div>
                <div class="form-group">
                    <label for="lark-webhook">Lark Webhook URL</label>
                    <input type="url" name="notification.lark_webhook" id="lark-webhook" placeholder="https://...">
                </div>
                <button type="submit" id="save-btn">Save &amp; Reload</button>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="/static/app.js"></script>
    <script>
        loadConfig();
        document.getElementById("settings-form").addEventListener("submit", saveConfig);
    </script>
</body>
</html>
