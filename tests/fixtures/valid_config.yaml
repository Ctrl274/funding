# Test fixture config
exchanges:
  binance:
    enabled: true
    api_key: "test_key"
    api_secret: "test_secret"
    testnet: false

  bybit:
    enabled: true
    api_key: "test_key"
    api_secret: "test_secret"
    testnet: false

  bydfi:
    enabled: true
    api_key: "test_key"
    api_secret: "test_secret"
    testnet: false

  mexc:
    enabled: true
    api_key: "test_key"
    api_secret: "test_secret"

strategy:
  min_rate_diff: 0.01
  position_mode: "fixed"
  position_value: 1000
  position_percent: 5
  max_concurrent: 3
  pre_settlement_seconds: 600
  partial_fill_action: "cancel_and_stop"

monitor:
  enabled: true
  time_windows:
    - "23:50-00:10"
    - "07:50-08:10"
    - "15:50-16:10"
  polling_interval: 60

notification:
  enabled: true
  lark_webhook: "https://open.larksuite.com/test"
  detail_level: "detailed"
